services:
  recommendation_service:
    build:
      context: ./services/recommendation
    restart: unless-stopped
    env_file:
      - ./services/recommendation/.env
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Browser-visible origin used by CORS and email links.
      FRONT_END_URI: ${FRONT_END_URI:-http://localhost:3000}
      # Internal Compose DNS; 127.0.0.1 would point back to the backend container.
      RECOMMENDATION_SERVICE_URL: http://recommendation_service:5000
    depends_on:
      recommendation_service:
        condition: service_healthy
    ports:
      # BACKEND_PORT is the host port; the application listens on 8080 in the container.
      - "${BACKEND_PORT:-4080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/docs').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
